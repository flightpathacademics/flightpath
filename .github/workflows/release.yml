name: Build and Attach Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ github.event.release.tag_name }}"

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "INVALID=false" >> $GITHUB_OUTPUT
          else
            echo "INVALID=true" >> $GITHUB_OUTPUT
          fi

      - name: Update release body if invalid
        if: steps.validate.outputs.INVALID == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;

            const body =
`Invalid release tag format.

Required format: X.Y.Z (example: 7.9.1)

Provided tag: ${release.tag_name}

No build artifact was generated. Please correct the tag and re-release.`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: body
            });

      - name: Stop if invalid version
        if: steps.validate.outputs.INVALID == 'true'
        run: |
          echo "Invalid version format"
          exit 1

      - name: Inject version into bootstrap.inc
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          sed -i "s/%FP_VERSION%/$VERSION/g" bootstrap.inc

      - name: Create release zip
        run: |
          zip -r flightpath.zip . \
            -x "*.git*" \
            -x ".github/*"

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./flightpath.zip
          asset_name: flightpath.zip
          asset_content_type: application/zip
