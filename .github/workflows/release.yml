name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Get version from tag and inject into PHP file
      - name: Inject version into bootstrap.inc
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Injecting version: $VERSION"
          
          # Replace placeholder safely
          sed -i "s/%FP_VERSION%/$VERSION/g" bootstrap.inc

      # 3. Create release artifact (zip your app)
      - name: Create ZIP package
        run: |
          zip -r flightpath.zip . \
            -x "*.git*" \
            -x ".github/*"

      # 4. Create GitHub Release and upload artifact
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: flightpath.zip