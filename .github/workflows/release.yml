name: Build and Attach Release Asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------
      # 1. Checkout code
      # -----------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------
      # 2. Validate version format
      # -----------------------------------
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          echo "Validating version: $VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "INVALID=true" >> $GITHUB_OUTPUT
          else
            echo "INVALID=false" >> $GITHUB_OUTPUT
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # -----------------------------------
      # 3. Mark release visibly as invalid (NO deletion)
      # -----------------------------------
      - name: Mark invalid release in UI
        if: steps.validate.outputs.INVALID == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;

            const warning =
`⚠️ **INVALID RELEASE TAG FORMAT**

This release did NOT pass CI validation.

### Required format
\`X.Y.Z\` (example: \`7.9.1\`)

### Your tag
\`${release.tag_name}\`

---

❌ No build artifact was generated.
❌ Please edit the tag or delete and recreate the release.

CI has stopped processing this release.`;

            // Update release body
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: warning,
              name: `❌ INVALID: ${release.name || release.tag_name}`
            });

      # -----------------------------------
      # 4. Stop workflow (no artifacts)
      # -----------------------------------
      - name: Stop invalid build
        if: steps.validate.outputs.INVALID == 'true'
        run: |
          echo "❌ Invalid version format. Build aborted."
          exit 1

      # -----------------------------------
      # 5. Inject version into PHP
      # -----------------------------------
      - name: Inject version into bootstrap.inc
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          sed -i "s/%FP_VERSION%/$VERSION/g" bootstrap.inc

      # -----------------------------------
      # 6. Build ZIP
      # -----------------------------------
      - name: Create release zip
        run: |
          zip -r flightpath.zip . \
            -x "*.git*" \
            -x ".github/*"

      # -----------------------------------
      # 7. Upload artifact
      # -----------------------------------
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./flightpath.zip
          asset_name: flightpath.zip
          asset_content_type: application/zip
